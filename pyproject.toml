[project]
name = "gestor-contratos"
version = "0.1.0"
description = "Sistema universitario de automatización de documentos de contratación"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "openpyxl>=3.1.5",
    "pydantic>=2.12.0",
    "pymupdf>=1.26.0",
    "streamlit[pdf]>=1.50.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gestor_contratos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
